[project]
name = "questionnaire-workflow-engine"
version = "0.1.0"
description = "Multi-agent workflow engine for security questionnaire automation."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy==1.14.1",
    "pre-commit==4.0.1",
    "pytest==8.3.4",
    "ruff==0.8.4",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "SIM",
    "UP",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_unused_configs = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
